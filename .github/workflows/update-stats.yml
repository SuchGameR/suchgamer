name: Update GitHub Stats and Metrics

on:
  schedule:
    - cron: '0 0 * * *' # 毎日0時に実行
  push:
    branches:
      - main
  workflow_dispatch: # 手動実行用

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 1. gh-stats-api の取得
      - name: Get gh-stats-api SVGs
        run: |
          curl --fail -H "x-gh-token: ${{ github.token }}" 'https://gh-stats-api.reizt.workers.dev/${{ github.actor }}?theme=light' > ./langs.light.svg
          curl --fail -H "x-gh-token: ${{ github.token }}" 'https://gh-stats-api.reizt.workers.dev/${{ github.actor }}?theme=dark'  > ./langs.dark.svg

      # 2. metrics-embed の生成
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.actor }}
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Tokyo
          filename: github-metrics.svg

      # 3. 変更をコミットしてプッシュ
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add langs.light.svg langs.dark.svg github-metrics.svg
          if (git diff --cached --shortstat | grep '[0-9]' ); then
            git commit -m "Update language stats and metrics"
            git push origin main
          fi
